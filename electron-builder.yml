appId: dz.transcar.blida.desktop
productName: TRANSCAR
copyright: Copyright © 2026 TRANSCAR Blida
directories:
  output: dist-electron
  buildResources: electron
files:
  - dist/**/*
  - electron/**/*
  - server.ts
  - src/server/**/*
  - src/db/**/*
  - src/shared/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/icon.png
  artifactName: TRANSCAR-Setup.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TRANSCAR
  uninstallDisplayName: TRANSCAR — Gestion Location Automobile
  deleteAppDataOnUninstall: false
